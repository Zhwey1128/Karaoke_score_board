<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Score Board</title>
    <link rel="icon" href="data:image/svg+xml,
<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22>
<text y=%22.9em%22 font-size=%2290%22>🎤</text>
</svg>">

    <style>
       * {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, #8b5cf6 0%, transparent 35%),
        radial-gradient(circle at top right, #ec4899 0%, transparent 35%),
        linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #222;
    padding: 30px 15px;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.96);
    border-radius: 28px;
    padding: 35px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}

/* =========================
   Header
========================= */

h1 {
    text-align: center;
    margin: 0;
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -1px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-top: 8px;
    margin-bottom: 30px;
    font-size: 16px;
    font-weight: 500;
}

/* =========================
   Sections
========================= */

.section {
    margin-top: 30px;
}

.section h2 {
    font-size: 22px;
    margin-bottom: 16px;
}

/* =========================
   Inputs
========================= */

input {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 10px;

    border: 2px solid #eee;
    border-radius: 12px;

    background: #fafafa;
    font-size: 16px;

    transition: 0.2s;
}

input:focus {
    outline: none;
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
}

/* =========================
   Buttons
========================= */

button {
    border: none;
    border-radius: 12px;

    padding: 12px 18px;

    background: #667eea;
    color: white;

    font-size: 15px;
    font-weight: 700;

    cursor: pointer;

    transition: 0.2s;
}

button:hover {
    background: #5568d9;
    transform: translateY(-1px);
}

.add-player-btn {
    width: 100%;
    margin-top: 5px;
    padding: 14px;
    font-size: 16px;
}

.add-score-btn {
    width: 100%;
    margin-top: 5px;
}

/* =========================
   Player Card
========================= */

.player {
    background: white;

    border-radius: 18px;

    padding: 20px;

    margin-top: 15px;

    border: 1px solid #eee;

    box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.06);
}

.player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 10px;

    margin-bottom: 15px;
}

.player-name {
    display: inline-block;

    font-size: 18px;
    font-weight: 800;

    color: #4f46e5;

    background: #eef2ff;

    padding: 7px 14px;

    border-radius: 999px;
}

/* =========================
   Scores
========================= */

.score {
    margin-top: 10px;

    padding: 12px 14px;

    background: #f8f9ff;

    border-radius: 12px;

    border: 1px solid #edf0ff;

    line-height: 1.6;
}

.score-number {
    font-size: 17px;
}

.score-high {
    color: #16a34a;
    font-weight: 800;
}

.score-medium {
    color: #f59e0b;
    font-weight: 800;
}

.score-low {
    color: #ef4444;
    font-weight: 800;
}

/* =========================
   Edit / Delete
========================= */

.edit-btn,
.delete-btn {
    padding: 6px 9px;

    font-size: 13px;

    border-radius: 8px;

    margin-left: 5px;
}

.edit-btn {
    background: #667eea;
}

.edit-btn:hover {
    background: #5568d9;
}

.delete-btn,
.delete-player-btn {
    background: #ef4444;
}

.delete-btn:hover,
.delete-player-btn:hover {
    background: #dc2626;
}

.delete-player-btn {
    padding: 7px 10px;

    font-size: 14px;

    border-radius: 9px;
}

/* =========================
   Empty Scores
========================= */

.no-score {
    margin-top: 10px;

    padding: 12px;

    text-align: center;

    color: #999;

    background: #fafafa;

    border-radius: 10px;

    font-size: 14px;
}

/* =========================
   Ranking Tabs
========================= */

.tabs {
    display: flex;

    gap: 8px;

    margin-bottom: 15px;

    padding: 5px;

    background: #f1f1f5;

    border-radius: 14px;

    flex-wrap: wrap;
}

.tabs button {
    flex: 1;

    min-width: 120px;

    background: transparent;

    color: #777;

    box-shadow: none;
}

.tabs button:hover {
    background: white;

    color: #667eea;

    transform: none;
}

.tabs button.active {
    background: white;

    color: #667eea;

    box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.08);
}

/* =========================
   Statistics
========================= */

.participant-count {
    text-align: center;

    color: #666;

    font-size: 14px;

    margin-bottom: 5px;
}

.last-updated {
    text-align: center;

    color: #aaa;

    font-size: 13px;

    margin-bottom: 18px;
}

/* =========================
   Ranking Cards
========================= */

.ranking {
    padding: 18px;

    margin-top: 12px;

    background: white;

    border-radius: 16px;

    border: 1px solid #eee;

    box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.06);

    line-height: 1.5;
}

.ranking strong {
    font-size: 17px;
}

.ranking-value {
    font-size: 22px;

    margin-left: 4px;
}

.ranking-details {
    margin-top: 6px;

    font-size: 14px;

    color: #777;

    line-height: 1.7;
}

/* Top 3 */

.rank-1 {
    border: 2px solid #f1c40f;

    background:
        linear-gradient(
            135deg,
            #fffdf2,
            #ffffff
        );

    box-shadow:
        0 8px 25px rgba(241, 196, 15, 0.18);

    transform: scale(1.02);
}

.rank-2 {
    border: 2px solid #bdc3c7;
}

.rank-3 {
    border: 2px solid #cd7f32;
}

.rank-1 strong,
.rank-2 strong,
.rank-3 strong {
    font-size: 19px;
}

/* =========================
   Competition Header
========================= */

.competition-header {
    text-align: center;
    margin-bottom: 30px;
}

.competition-title {
    font-size: 34px;
    font-weight: 800;
    color: #4f46e5;
    letter-spacing: -0.5px;
}

.competition-subtitle {
    margin-top: 6px;
    font-size: 15px;
    color: #999;
    font-weight: 600;
    letter-spacing: 1px;
}

.competition-header .subtitle {
    margin-top: 10px;
    margin-bottom: 0;
}

@media (max-width: 600px) {
    .competition-title {
        font-size: 25px;
    }

    .competition-subtitle {
        font-size: 13px;
    }
}

.new-competition-btn,
.share-btn {
    margin-top: 12px;
    margin-right: 5px;
    padding: 9px 14px;
    font-size: 13px;
    border-radius: 10px;
}

.new-competition-btn {
    background: #667eea;
}

.new-competition-btn:hover {
    background: #5568d9;
}

.share-btn {
    background: #10b981;
}

.share-btn:hover {
    background: #059669;
}

@media (max-width: 600px) {
    .new-competition-btn,
    .share-btn {
        width: 100%;
        margin-right: 0;
    }
}

.competition-list-page {
    text-align: center;
}

.home-title {
    font-size: 36px;
    font-weight: 800;
    color: #4f46e5;
    margin-top: 10px;
}

.home-subtitle {
    margin-top: 8px;
    margin-bottom: 25px;
    color: #888;
    font-size: 15px;
}

.create-home-btn {
    width: 100%;
    max-width: 400px;
    padding: 15px;
    font-size: 16px;
    margin-bottom: 25px;
}

.competition-item {
    background: white;
    border: 1px solid #eee;
    border-radius: 18px;
    padding: 20px;
    margin-top: 14px;
    text-align: left;
    cursor: pointer;
    box-shadow: 0 5px 18px rgba(0, 0, 0, 0.06);
    transition: 0.2s;
}

.competition-item:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
}

.competition-item-name {
    font-size: 19px;
    font-weight: 800;
    color: #4f46e5;
}

.competition-item-info {
    margin-top: 8px;
    font-size: 14px;
    color: #888;
}

.no-competitions {
    padding: 30px 10px;
    color: #999;
}

.back-home-btn {
    margin-top: 10px;
    background: #777;
}

@media (max-width: 600px) {
    .home-title {
        font-size: 28px;
    }

    .competition-item {
        padding: 17px;
    }
}

/* =========================
   Participant Card
========================= */

.player {
    background: linear-gradient(
        145deg,
        #ffffff,
        #f8f9ff
    );
    border-radius: 22px;
    padding: 22px;
    margin-top: 18px;
    border: 1px solid #e8eaff;
    box-shadow: 0 8px 25px rgba(79, 70, 229, 0.08);
}

.player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
}

.player-profile {
    display: flex;
    align-items: center;
    gap: 12px;
}

.player-avatar {
    width: 48px;
    height: 48px;
    border-radius: 15px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(
        135deg,
        #667eea,
        #7c3aed
    );

    color: white;
    font-size: 20px;
    font-weight: 800;

    box-shadow:
        0 6px 15px rgba(102, 126, 234, 0.3);
}

.player-name {
    display: inline-block;
    padding: 0;
    background: transparent;
    color: #303070;
    font-size: 20px;
    font-weight: 800;
}

.player-stats {
    margin-top: 4px;
    color: #999;
    font-size: 13px;
}

.player-summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 15px;
}

.summary-item {
    background: #f5f6ff;
    border-radius: 13px;
    padding: 10px;
    text-align: center;
}

.summary-item span {
    display: block;
    font-size: 12px;
    color: #999;
    margin-bottom: 3px;
}

.summary-item strong {
    font-size: 17px;
    color: #4f46e5;
}

/* =========================
   Score Card
========================= */

.score {
    margin-top: 10px;
    padding: 14px;
    background: white;
    border-radius: 15px;
    border: 1px solid #edf0ff;
}

.score-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.score-song {
    display: flex;
    align-items: center;
    gap: 9px;
    min-width: 0;
}

.score-song strong {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.song-number {
    width: 26px;
    height: 26px;
    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #eef2ff;
    color: #667eea;

    border-radius: 8px;
    font-size: 12px;
    font-weight: 800;
}

.score-actions {
    display: flex;
    flex-shrink: 0;
}

.score-value-row {
    margin-top: 10px;
    display: flex;
    align-items: baseline;
    gap: 4px;
}

.score-value-row strong {
    font-size: 22px;
}

.score-out-of {
    font-size: 12px;
    color: #aaa;
}

/* =========================
   Score Progress Bar
========================= */

.score-bar {
    width: 100%;
    height: 8px;
    margin-top: 7px;

    background: #eeeef5;
    border-radius: 999px;
    overflow: hidden;
}

.score-bar-fill {
    height: 100%;
    border-radius: 999px;
    transition: width 0.5s ease;
}

.bar-high {
    background: linear-gradient(
        90deg,
        #22c55e,
        #16a34a
    );
}

.bar-medium {
    background: linear-gradient(
        90deg,
        #fbbf24,
        #f59e0b
    );
}

.bar-low {
    background: linear-gradient(
        90deg,
        #fb7185,
        #ef4444
    );
}

/* =========================
   Add Score Area
========================= */

.add-score-area {
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px dashed #dddff0;
}

/* =========================
   Host Login
========================= */

.host-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

#loginStatus {
    font-size: 13px;
    color: #888;
}

.host-login-btn {
    background: #4f46e5;
    padding: 8px 13px;
    font-size: 13px;
}

.host-logout-btn {
    background: #777;
    padding: 8px 13px;
    font-size: 13px;
}

.login-modal {
    display: none;

    position: fixed;
    inset: 0;

    background: rgba(0, 0, 0, 0.45);

    align-items: center;
    justify-content: center;

    z-index: 9999;

    padding: 20px;
}

.login-box {
    width: 100%;
    max-width: 380px;

    background: white;
    border-radius: 22px;

    padding: 28px;

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.25);
}

.login-title {
    text-align: center;
    font-size: 23px;
    font-weight: 800;
    color: #4f46e5;
}

.login-subtitle {
    text-align: center;
    color: #999;
    font-size: 13px;
    margin: 7px 0 20px;
}

.login-submit-btn {
    width: 100%;
    margin-top: 5px;
}

.login-cancel-btn {
    width: 100%;
    margin-top: 8px;
    background: #eee;
    color: #666;
}

.login-cancel-btn:hover {
    background: #ddd;
}

.login-error {
    text-align: center;
    color: #ef4444;
    font-size: 13px;
    margin-top: 12px;
}

.host-only {
    display: block;
}

@media (max-width: 600px) {

    .host-controls {
        margin-bottom: 12px;
    }

    .host-login-btn,
    .host-logout-btn {
        padding: 7px 11px;
    }

    .login-box {
        padding: 22px;
    }
}

/* =========================
   Mobile
========================= */

@media (max-width: 600px) {

    .player {
        padding: 16px;
        border-radius: 18px;
    }

    .player-avatar {
        width: 42px;
        height: 42px;
        border-radius: 13px;
        font-size: 17px;
    }

    .player-name {
        font-size: 17px;
    }

    .player-summary {
        gap: 5px;
    }

    .summary-item {

    }

    }

    .score-song {

    }

    .score-song strong {
        max-width: 150px;
    }

    .score-value-row strong {

    }
}

/* =========================
   Mobile
========================= */

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .container {

    }

    h1 {

    }

    .subtitle {
        font-size: 14px;

    }

    .section h2 {
        font-size: 20px;
    }

    .player {
        padding: 15px;
    }

    .player-header {
        align-items: flex-start;
    }

    }

    .tabs button {

    }

    .ranking {

    }

    }
} 
    </style>

<body>

<div class="container">
    <div id="competitionListPage" class="competition-list-page">

    <div class="home-title">
        🎤 Karaoke Score Board
    </div>

    <div class="home-subtitle">

    </div>

    </button>

</div>

    <div id="competitionPage">
    <div class="competition-header">
        <div class="host-controls">

    <span id="loginStatus">
        👀 观众模式
    </span>

    <button
        id="loginBtn"
        class="host-login-btn"
        onclick="showLogin()"
    >
        🔐 主办人登录
    </button>

    <button
        id="logoutBtn"
        class="host-logout-btn"
        onclick="logoutHost()"
        style="display:none;"
    >
        登出
    </button>

</div>
    <div class="competition-title">
    🎤 <span id="competitionName">加载中...</span>
</div>

<button class="new-competition-btn" onclick="createNewCompetition()">
    🆕 新比赛
</button>

<button class="share-btn" onclick="shareCompetition()">
    🔗 分享比赛
</button>

    <div class="competition-subtitle">
        Karaoke Score Board
    </div>

    <div class="subtitle">
        🏆 唱K大赛评分系统
    </div>
        <button
    class="back-home-btn"
    onclick="window.location.href = window.location.pathname"
>
    ← 比赛列表
</button>
</div>

    <div class="section">
        <h2>👤 参加者</h2>

        <div class="host-only">

    <input 
        type="text" 
        id="playerName" 
        placeholder="输入参加者名字"
        onkeydown="if(event.key === 'Enter') addPlayer()"
    >

    <button
        class="add-player-btn"
        onclick="addPlayer()"
    >
        ＋ 添加参加者
    </button>

</div>

        <div id="players"></div>
    </div>

    <div class="section">
        <h2>🏆 排名</h2>

        <div class="tabs">
    <button id="totalTab" onclick="showRanking('total')">总分</button>
    <button id="averageTab" onclick="showRanking('average')">平均分</button>
    <button id="songTab" onclick="showRanking('song')">🎵 单曲排名</button>
</div>

<div class="participant-count" id="participantCount"></div>
        <div class="last-updated" id="lastUpdated"></div>

<div id="ranking"></div>
    </div>

</div>

<script>

    const SUPABASE_URL =
        "https://jghskmotttmgyieculia.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_cBk56ezlh6xOGHXZzdnXHA_xfzmyCHB";

    let players = [];

    let currentCompetitionId =
    new URLSearchParams(window.location.search).get("competition");

let currentCompetitionName = "";

    let authToken =
    localStorage.getItem("karaoke_auth_token");

let currentUserId =
    localStorage.getItem("karaoke_user_id");

let isHost = false;

async function checkHostAuth() {

    if (!authToken || !currentUserId) {
        return false;
    }

    const response = await fetch(
        SUPABASE_URL + "/auth/v1/user",
        {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + authToken
            }
        }
    );

    if (!response.ok) {

        console.log("Auth check failed:", await response.text());

        authToken = null;
        currentUserId = null;
        isHost = false;

        localStorage.removeItem("karaoke_auth_token");
        localStorage.removeItem("karaoke_user_id");

        updateHostUI();

        alert("登录已失效，请重新登录");

        return false;
    }

    const user = await response.json();

    console.log("Current logged in user:", user.id);

    currentUserId = user.id;

    localStorage.setItem(
        "karaoke_user_id",
        currentUserId
    );

    isHost = true;

    return true;
}


function showLogin() {
    document.getElementById("loginModal").style.display = "flex";
    document.getElementById("loginError").textContent = "";
}


function closeLogin() {
    document.getElementById("loginModal").style.display = "none";
}


async function loginHost() {

    const email =
        document.getElementById("loginEmail").value.trim();

    const password =
        document.getElementById("loginPassword").value;

    const errorBox =
        document.getElementById("loginError");

    errorBox.textContent = "";

    if (email === "" || password === "") {
        errorBox.textContent =
            "请输入 Email 和密码";
        return;
    }

    const response = await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
            method: "POST",

            headers: {
                "apikey": SUPABASE_KEY,
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                password: password
            })
        }
    );

    const data = await response.json();

    if (!response.ok) {
        console.log(data);

        errorBox.textContent =
            "Email 或密码错误";

        return;
    }

    authToken = data.access_token;
    currentUserId = data.user.id;

    localStorage.setItem(
        "karaoke_auth_token",
        authToken
    );

    localStorage.setItem(
        "karaoke_user_id",
        currentUserId
    );

    isHost = true;

    closeLogin();

    updateHostUI();

    await loadPlayers();
}


function logoutHost() {

    authToken = null;
    currentUserId = null;
    isHost = false;

    localStorage.removeItem(
        "karaoke_auth_token"
    );

    localStorage.removeItem(
        "karaoke_user_id"
    );

    updateHostUI();

    loadPlayers();
}


function updateHostUI() {

    const loginStatus =
        document.getElementById("loginStatus");

    const loginBtn =
        document.getElementById("loginBtn");

    const logoutBtn =
        document.getElementById("logoutBtn");

    if (isHost) {

        loginStatus.textContent =
            "🔐 主办人模式";

        loginStatus.style.color =
            "#16a34a";

        loginBtn.style.display =
            "none";

        logoutBtn.style.display =
            "inline-block";

    } else {

        loginStatus.textContent =
            "👀 观众模式";

        loginStatus.style.color =
            "#888";

        loginBtn.style.display =
            "inline-block";

        logoutBtn.style.display =
            "none";
    }

    updateManagementUI();

    console.log("HOST STATUS:", isHost);
    console.log(
        "HOST ELEMENTS:",
        document.querySelectorAll(".host-only").length
    );
}


function updateManagementUI() {

    document
        .querySelectorAll(".host-only")
        .forEach(element => {

            if (isHost) {
                element.style.display = "";
            } else {
                element.style.display = "none";
            }

        });
}

    document.getElementById("competitionListPage").style.display = "none";
    document.getElementById("competitionPage").style.display = "block";
}

function showCompetitionListPage() {
    document.getElementById("competitionListPage").style.display = "block";
    document.getElementById("competitionPage").style.display = "none";
}

async function loadCompetitionList() {
    showCompetitionListPage();

    const container =
        document.getElementById("competitionList");

    container.innerHTML = "⏳ 正在读取比赛...";

    const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/competitions?select=*&order=created_at.desc",
        {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
            }
        }
    );

    if (!response.ok) {
        container.innerHTML = "❌ 无法读取比赛";
        return;
    }

    const competitions = await response.json();

    if (competitions.length === 0) {
        container.innerHTML = `
            <div class="no-competitions">
                目前还没有比赛
            </div>
        `;
        return;
    }

    container.innerHTML = "";

    for (const competition of competitions) {

        const scoreResponse = await fetch(
            SUPABASE_URL +
            "/rest/v1/scores?competition_id=eq." +
            competition.id +
            "&select=player_name",
            {
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY
                }
            }
        );

        const scores = await scoreResponse.json();

        const players = [
            ...new Set(
                scores.map(item => item.player_name)
            )
        ];

        container.innerHTML += `
            <div
                class="competition-item"
                onclick="openCompetition('${competition.id}')"
            >

                <div class="competition-item-name">
                    🎤 ${competition.name}
                </div>

                <div class="competition-item-info">
                    👥 ${players.length} 人
                   　·　
                    🎵 ${scores.length} 首歌曲
                </div>

            </div>
        `;
    }
}

function openCompetition(id) {

        "?competition=" +
        id;
}

    async function loadPlayers() {

    try {

        console.log(
            "Loading competition:",
            currentCompetitionId
        );

        /*
         * 1. 读取比赛资料
         */

        const competitionResponse =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/competitions?id=eq." +
                currentCompetitionId +
                "&select=*",
                {
                    headers: {
                        "apikey": SUPABASE_KEY
                    }
                }
            );

        if (!competitionResponse.ok) {

            console.log(
                "Competition load failed:",
                await competitionResponse.text()
            );

            alert("读取比赛资料失败");
            return;
        }

        const competitionData =
    await competitionResponse.json();

if (competitionData.length > 0) {

    currentCompetitionName =
        competitionData[0].name;

    document.getElementById(
        "competitionName"
    ).textContent =
        currentCompetitionName;
}


        /*
         * 2. 读取所有参加者
         */

        const participantsResponse =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/participants?competition_id=eq." +
                currentCompetitionId +
                "&select=*"
                ,
                {
                    headers: {
                        "apikey": SUPABASE_KEY
                    }
                }
            );

        if (!participantsResponse.ok) {

            console.log(
                "Participants load failed:",
                await participantsResponse.text()
            );

            alert("读取参加者失败");
            return;
        }

        const participants =
            await participantsResponse.json();


        /*
         * 3. 读取所有歌曲 / 分数
         */

        const scoresResponse =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/scores?competition_id=eq." +
                currentCompetitionId +
                "&select=*",
                {
                    headers: {
                        "apikey": SUPABASE_KEY
                    }
                }
            );

        if (!scoresResponse.ok) {

            console.log(
                "Scores load failed:",
                await scoresResponse.text()
            );

            alert("读取分数失败");
            return;
        }

        const scores =
            await scoresResponse.json();


        /*
         * 4. 建立参加者名单
         */

        players = participants.map(
            participant => {

                const playerScores =
                    scores.filter(
                        score =>
                            score.player_name ===
                            participant.name
                    );

                return {
                    id: participant.id,
                    name: participant.name,
                    scores: playerScores
                };

            }
        );


        /*
         * 5. 如果数据库里面有旧的分数，
         *    但参加者资料还没有建立，
         *    自动补回参加者
         */

        scores.forEach(score => {

            const exists =
                players.some(
                    player =>
                        player.name ===
                        score.player_name
                );

            if (!exists) {

                players.push({
                    id: null,
                    name: score.player_name,
                    scores: scores.filter(
                        item =>
                            item.player_name ===
                            score.player_name
                    )
                });

            }

        });


        /*
         * 6. 显示参加者
         */

        displayPlayers();

        showRanking("total");


        console.log(
            "Participants loaded:",
            players
        );

    } catch (error) {

        console.error(
            "LOAD PLAYERS ERROR:",
            error
        );

        alert(
            "读取资料时发生错误\n\n" +
            error.message
        );
    }
}

    async function addScore(index) {

    if (!(await checkHostAuth())) {
        return;
    }

    const songInput =
        document.getElementById("song-" + index);

    const scoreInput =
        document.getElementById("score-" + index);

    const songName =
        songInput.value.trim();

    const score =
        parseFloat(scoreInput.value);

    if (songName === "") {
        alert("请输入歌曲名称");
        return;
    }

    if (isNaN(score)) {
        alert("请输入正确的分数");
        return;
    }

    if (score < 0 || score > 100) {
        alert("分数必须在 0 到 100 之间");
        return;
    }

    console.log("Adding score");
    console.log("Competition:", currentCompetitionId);
    console.log("User:", currentUserId);

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/scores",
        {
            method: "POST",

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + authToken,
                "Content-Type": "application/json",
                "Prefer": "return=representation"
            },

            body: JSON.stringify({
                competition_id: currentCompetitionId,
                player_name: players[index].name,
                song_name: songName,
                score: score
            })
        }
    );

    const result = await response.text();

    console.log(
        "ADD SCORE:",
        response.status,
        result
    );

    if (!response.ok) {

        alert(
            "添加分数失败\n\n" +
            "HTTP: " + response.status +
            "\n\n" +
            result
        );

        return;
    }

    songInput.value = "";
    scoreInput.value = "";

    await loadPlayers();
}

    async function editScore(id) {

    if (!(await checkHostAuth())) {
        return;
    }

    const songName = prompt(
        "请输入新的歌曲名称："
    );

    if (songName === null) {
        return;
    }

    const newScore = prompt(
        "请输入新的分数："
    );

    if (newScore === null) {
        return;
    }

    const score = parseFloat(newScore);

    if (songName.trim() === "") {
        alert("歌曲名称不能为空");
        return;
    }

    if (isNaN(score)) {
        alert("请输入正确的分数");
        return;
    }

    if (score < 0 || score > 100) {
        alert("分数必须在 0 到 100 之间");
        return;
    }

    const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/scores?id=eq." +
        id,
        {
            method: "PATCH",

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + authToken,
                "Content-Type": "application/json",
                "Prefer": "return=representation"
            },

            body: JSON.stringify({
                song_name: songName.trim(),
                score: score
            })
        }
    );

    const result = await response.text();

    console.log(
        "EDIT SCORE:",
        response.status,
        result
    );

    if (!response.ok) {

        alert(
            "修改失败\n\n" +
            "HTTP: " + response.status +
            "\n\n" +
            result
        );

        return;
    }

    await loadPlayers();
}


    function displayPlayers() {
    const container = document.getElementById("players");
    container.innerHTML = "";

    players.forEach((player, index) => {

        let scoresHTML = "";

        const total = player.scores.reduce(
            (sum, item) => sum + Number(item.score),
            0
        );

        const average = player.scores.length > 0
            ? total / player.scores.length
            : 0;

        const highest = player.scores.length > 0
            ? Math.max(
                ...player.scores.map(item => Number(item.score))
            )
            : 0;

        if (player.scores.length === 0) {
            scoresHTML = `
                <div class="no-score">
                    🎵 还没有添加歌曲
                </div>
            `;
        }

        player.scores.forEach((item, scoreIndex) => {

            const scoreValue = Number(item.score);

            const scoreClass =
                scoreValue >= 90 ? "score-high" :
                scoreValue >= 80 ? "score-medium" :
                "score-low";

            const scoreBarClass =
                scoreValue >= 90 ? "bar-high" :
                scoreValue >= 80 ? "bar-medium" :
                "bar-low";

            scoresHTML += `
                <div class="score">

                    <div class="score-top">

                        <div class="score-song">
                            <span class="song-number">
                                ${scoreIndex + 1}
                            </span>

                            <strong>
                                ${item.song_name || "未命名歌曲"}
                            </strong>
                        </div>

                        <div class="score-actions">

                            <button
    class="edit-btn host-only"
    onclick="editScore(${item.id})"
                                title="修改歌曲和分数"
                            >
                                ✏️
                            </button>

                            <button
    class="delete-btn host-only"
    onclick="deleteScore(${item.id})"
                                title="删除这首歌曲"
                            >
                                🗑️
                            </button>

                        </div>

                    </div>

                    <div class="score-value-row">

                        <strong class="${scoreClass}">
                            ${scoreValue.toFixed(2)}
                        </strong>

                        <span class="score-out-of">
                            / 100
                        </span>

                    </div>

                    <div class="score-bar">
                        <div
                            class="score-bar-fill ${scoreBarClass}"
                            style="width: ${scoreValue}%"
                        ></div>
                    </div>

                </div>
            `;
        });

        container.innerHTML += `

            <div class="player">

                <div class="player-header">

                    <div class="player-profile">

                        <div class="player-avatar">
                            ${player.name.charAt(0).toUpperCase()}
                        </div>

                        <div>

                            <div class="player-name">
                                ${player.name}
                            </div>

                            <div class="player-stats">
                                🎵 ${player.scores.length} 首歌曲
                                ${player.scores.length > 0
                                    ? ` · ⭐ 最高 ${highest.toFixed(2)}`
                                    : ""
                                }
                            </div>

                        </div>

                    </div>

                    <button
    class="delete-player-btn host-only"
                        onclick="deletePlayer(${index})"
                        title="删除参加者"
                    >
                        🗑️
                    </button>

                </div>

                ${
                    player.scores.length > 0
                    ? `
                        <div class="player-summary">

                            <div class="summary-item">
                                <span>平均分</span>
                                <strong>
                                    ${average.toFixed(2)}
                                </strong>
                            </div>

                            <div class="summary-item">
                                <span>最高分</span>
                                <strong>
                                    ${highest.toFixed(2)}
                                </strong>
                            </div>

                            <div class="summary-item">
                                <span>总分</span>
                                <strong>
                                    ${total.toFixed(2)}
                                </strong>
                            </div>

                        </div>
                    `
                    : ""
                }

                <div class="player-scores">

                    ${scoresHTML}

                </div>

                <div
    class="add-score-area host-only"
>

                    <input
                        type="text"
                        id="song-${index}"
                        placeholder="🎵 输入歌曲名称"
                        onkeydown="if(event.key === 'Enter') addScore(${index})"
                    >

                    <input
                        type="number"
                        id="score-${index}"
                        placeholder="⭐ 输入分数，例如 95.50"
                        step="0.01"
                        min="0"
                        max="100"
                        onkeydown="if(event.key === 'Enter') addScore(${index})"
                    >

                    <button
                        class="add-score-btn"
                        onclick="addScore(${index})"
                    >
                        ＋ 添加分数
                    </button>

                </div>

            </div>
        `;
    });
            updateManagementUI();
}


    function showRanking(type) {
    const rankingContainer = document.getElementById("ranking");

    const totalSongs = players.reduce(
    (sum, player) => sum + player.scores.length,
    0
);

document.getElementById("participantCount").innerHTML =
    `👥 参赛人数：${players.length} 人
    　🎵 总歌曲数：${totalSongs} 首`;

    document.getElementById("lastUpdated").textContent =
    "🕒 最后更新：" +
    new Date().toLocaleTimeString("zh-CN", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });

    document.getElementById("totalTab").classList.remove("active");
    document.getElementById("averageTab").classList.remove("active");
    document.getElementById("songTab").classList.remove("active");

    if (type === "total") {
    document.getElementById("totalTab").classList.add("active");
} else if (type === "average") {
    document.getElementById("averageTab").classList.add("active");
} else {
    document.getElementById("songTab").classList.add("active");
}

if (type === "song") {
    const songs = [];

    players.forEach(player => {

            });
        });
    });

    songs.sort((a, b) => b.score - a.score);

    songs.forEach((song, index) => {

                </div>

                    ${song.score.toFixed(2)}
                </strong>
            </div>
        `;
    });

    return;
}
        
    let ranking = players.map(player => {

        const total = player.scores.reduce(
            (sum, item) => sum + Number(item.score),

        );

        const average = player.scores.length > 0
            ? total / player.scores.length
            : 0;

        return {
    name: player.name,
    total: total,
    average: average,
    songCount: player.scores.length,
    highest: player.scores.length > 0
        ? Math.max(...player.scores.map(item => Number(item.score)))
        : 0
};

    });

    if (type === "total") {

        ranking.sort((a, b) => b.total - a.total);

    } else {

        ranking.sort((a, b) => b.average - a.average);

    }

    rankingContainer.innerHTML = "";

    ranking.forEach((player, index) => {

        const number =
            index === 0 ? "🥇" :
            index === 1 ? "🥈" :
            index === 2 ? "🥉" :
            `${index + 1}.`;

        const rankingScore =
    type === "total"
        ? player.total
        : player.average;

const rankingClass =
    rankingScore >= 90 ? "score-high" :
    rankingScore >= 80 ? "score-medium" :
    "score-low";

const value = rankingScore.toFixed(2);

        rankingContainer.innerHTML += `
            <div class="ranking rank-${index + 1}">
    <strong>
        ${number} ${player.name}
    </strong>
    <br>
    ${type === "total" ? "总分" : "平均分"}：
<strong class="ranking-value ${rankingClass}">${value}</strong>
    <div class="ranking-details">
    🎵 歌曲数：${player.songCount}
    <br>
    ⭐ 最高分：${player.highest.toFixed(2)}
</div>
</div>
        `;

    });
}

    async function createNewCompetition() {

        "请输入新比赛名称："
    );

    if (name === null) {
        return;
    }

    const competitionName = name.trim();

    if (competitionName === "") {
        alert("比赛名称不能为空");
        return;
    }

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/competitions",
        {
            method: "POST",
            headers: {
    "apikey": SUPABASE_KEY,
    "Authorization": "Bearer " + authToken,
    "Content-Type": "application/json",
    "Prefer": "return=representation"
},
            body: JSON.stringify({
                name: competitionName,

}

        );
    } catch (error) {

        );
    }
}

    async function deletePlayer(index) {

    if (!(await checkHostAuth())) {
        return;
    }

    const player = players[index];

    if (!player) {
        alert("找不到这个参加者");
        return;
    }

    const confirmDelete = confirm(
        "确定要删除参加者「" +
        player.name +
        "」吗？\n\n" +
        "这个参加者的所有歌曲和分数也会一起删除。"
    );

    if (!confirmDelete) {
        return;
    }

    console.log(
        "Deleting participant:",
        player.name
    );

    /*
     * 1. 删除这个参加者的所有歌曲
     */

    const scoresResponse = await fetch(
        SUPABASE_URL +
        "/rest/v1/scores?competition_id=eq." +
        currentCompetitionId +
        "&player_name=eq." +
        encodeURIComponent(player.name),
        {
            method: "DELETE",
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization":
                    "Bearer " + authToken,
                "Content-Type":
                    "application/json"
            }
        }
    );

    const scoresResult =
        await scoresResponse.text();

    console.log(
        "DELETE PLAYER SCORES:",
        scoresResponse.status,
        scoresResult
    );

    if (!scoresResponse.ok) {

        alert(
            "删除歌曲记录失败\n\n" +
            "HTTP: " +
            scoresResponse.status +
            "\n\n" +
            scoresResult
        );

        return;
    }


    /*
     * 2. 删除 participants 里面的参加者
     */

    if (player.id !== null) {

        const participantResponse =
            await fetch(
                SUPABASE_URL +
                "/rest/v1/participants?id=eq." +
                player.id,
                {
                    method: "DELETE",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization":
                            "Bearer " + authToken,
                        "Content-Type":
                            "application/json"
                    }
                }
            );

        const participantResult =
            await participantResponse.text();

        console.log(
            "DELETE PARTICIPANT:",
            participantResponse.status,
            participantResult
        );

        if (!participantResponse.ok) {

            alert(
                "删除参加者失败\n\n" +
                "HTTP: " +
                participantResponse.status +
                "\n\n" +
                participantResult
            );

            return;
        }
    }


    /*
     * 3. 重新读取资料
     */

    await loadPlayers();

    alert(
        "参加者「" +
        player.name +
        "」已经删除"
    );
}

   (async function init() {

    if (authToken && currentUserId) {
        await checkHostAuth();
    }

    updateHostUI();

    if (currentCompetitionId) {
        showCompetitionPage();
        await loadPlayers();
    } else {
        loadCompetitionList();
    }

})();

</script>
