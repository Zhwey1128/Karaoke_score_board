<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Score Board</title>

    <style>
       * {
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top left, #8b5cf6 0%, transparent 35%),
        radial-gradient(circle at top right, #ec4899 0%, transparent 35%),
        linear-gradient(135deg, #4f46e5, #7c3aed);
    color: #222;
    padding: 30px 15px;
}

.container {
    max-width: 900px;
    margin: 0 auto;
    background: rgba(255, 255, 255, 0.96);
    border-radius: 28px;
    padding: 35px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}

/* =========================
   Header
========================= */

h1 {
    text-align: center;
    margin: 0;
    font-size: 36px;
    font-weight: 800;
    letter-spacing: -1px;
}

.subtitle {
    text-align: center;
    color: #777;
    margin-top: 8px;
    margin-bottom: 30px;
    font-size: 16px;
    font-weight: 500;
}

/* =========================
   Sections
========================= */

.section {
    margin-top: 30px;
}

.section h2 {
    font-size: 22px;
    margin-bottom: 16px;
}

/* =========================
   Inputs
========================= */

input {
    width: 100%;
    padding: 14px 16px;
    margin-bottom: 10px;

    border: 2px solid #eee;
    border-radius: 12px;

    background: #fafafa;
    font-size: 16px;

    transition: 0.2s;
}

input:focus {
    outline: none;
    border-color: #667eea;
    background: white;
    box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.12);
}

/* =========================
   Buttons
========================= */

button {
    border: none;
    border-radius: 12px;

    padding: 12px 18px;

    background: #667eea;
    color: white;

    font-size: 15px;
    font-weight: 700;

    cursor: pointer;

    transition: 0.2s;
}

button:hover {
    background: #5568d9;
    transform: translateY(-1px);
}

.add-player-btn {
    width: 100%;
    margin-top: 5px;
    padding: 14px;
    font-size: 16px;
}

.add-score-btn {
    width: 100%;
    margin-top: 5px;
}

/* =========================
   Player Card
========================= */

.player {
    background: white;

    border-radius: 18px;

    padding: 20px;

    margin-top: 15px;

    border: 1px solid #eee;

    box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.06);
}

.player-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 10px;

    margin-bottom: 15px;
}

.player-name {
    display: inline-block;

    font-size: 18px;
    font-weight: 800;

    color: #4f46e5;

    background: #eef2ff;

    padding: 7px 14px;

    border-radius: 999px;
}

/* =========================
   Scores
========================= */

.score {
    margin-top: 10px;

    padding: 12px 14px;

    background: #f8f9ff;

    border-radius: 12px;

    border: 1px solid #edf0ff;

    line-height: 1.6;
}

.score-number {
    font-size: 17px;
}

.score-high {
    color: #16a34a;
    font-weight: 800;
}

.score-medium {
    color: #f59e0b;
    font-weight: 800;
}

.score-low {
    color: #ef4444;
    font-weight: 800;
}

/* =========================
   Edit / Delete
========================= */

.edit-btn,
.delete-btn {
    padding: 6px 9px;

    font-size: 13px;

    border-radius: 8px;

    margin-left: 5px;
}

.edit-btn {
    background: #667eea;
}

.edit-btn:hover {
    background: #5568d9;
}

.delete-btn,
.delete-player-btn {
    background: #ef4444;
}

.delete-btn:hover,
.delete-player-btn:hover {
    background: #dc2626;
}

.delete-player-btn {
    padding: 7px 10px;

    font-size: 14px;

    border-radius: 9px;
}

/* =========================
   Empty Scores
========================= */

.no-score {
    margin-top: 10px;

    padding: 12px;

    text-align: center;

    color: #999;

    background: #fafafa;

    border-radius: 10px;

    font-size: 14px;
}

/* =========================
   Ranking Tabs
========================= */

.tabs {
    display: flex;

    gap: 8px;

    margin-bottom: 15px;

    padding: 5px;

    background: #f1f1f5;

    border-radius: 14px;

    flex-wrap: wrap;
}

.tabs button {
    flex: 1;

    min-width: 120px;

    background: transparent;

    color: #777;

    box-shadow: none;
}

.tabs button:hover {
    background: white;

    color: #667eea;

    transform: none;
}

.tabs button.active {
    background: white;

    color: #667eea;

    box-shadow:
        0 3px 10px rgba(0, 0, 0, 0.08);
}

/* =========================
   Statistics
========================= */

.participant-count {
    text-align: center;

    color: #666;

    font-size: 14px;

    margin-bottom: 5px;
}

.last-updated {
    text-align: center;

    color: #aaa;

    font-size: 13px;

    margin-bottom: 18px;
}

/* =========================
   Ranking Cards
========================= */

.ranking {
    padding: 18px;

    margin-top: 12px;

    background: white;

    border-radius: 16px;

    border: 1px solid #eee;

    box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.06);

    line-height: 1.5;
}

.ranking strong {
    font-size: 17px;
}

.ranking-value {
    font-size: 22px;

    margin-left: 4px;
}

.ranking-details {
    margin-top: 6px;

    font-size: 14px;

    color: #777;

    line-height: 1.7;
}

/* Top 3 */

.rank-1 {
    border: 2px solid #f1c40f;

    background:
        linear-gradient(
            135deg,
            #fffdf2,
            #ffffff
        );

    box-shadow:
        0 8px 25px rgba(241, 196, 15, 0.18);

    transform: scale(1.02);
}

.rank-2 {
    border: 2px solid #bdc3c7;
}

.rank-3 {
    border: 2px solid #cd7f32;
}

.rank-1 strong,
.rank-2 strong,
.rank-3 strong {
    font-size: 19px;
}

/* =========================
   Mobile
========================= */

@media (max-width: 600px) {

    body {
        padding: 10px;
    }

    .container {
        padding: 20px 15px;

        border-radius: 20px;
    }

    h1 {
        font-size: 27px;
    }

    .subtitle {
        font-size: 14px;

        margin-bottom: 25px;
    }

    .section h2 {
        font-size: 20px;
    }

    .player {
        padding: 15px;
    }

    .player-header {
        align-items: flex-start;
    }

    .player-name {
        font-size: 16px;
    }

    .tabs {
        gap: 5px;
    }

    .tabs button {
        min-width: 100%;

        padding: 10px;
    }

    .ranking {
        padding: 15px;
    }

    .rank-1 {
        transform: none;
    }
} 
    </style>
</head>

<body>

<div class="container">

    <h1>🎤 Karaoke Score Board</h1>
    <div class="subtitle">唱K大赛评分系统</div>

    <div class="section">
        <h2>👤 参加者</h2>

        <input 
            type="text" 
            id="playerName" 
            placeholder="输入参加者名字"
            onkeydown="if(event.key === 'Enter') addPlayer()"
        >

        <button class="add-player-btn" onclick="addPlayer()">
    ＋ 添加参加者
</button>

        <div id="players"></div>
    </div>

    <div class="section">
        <h2>🏆 排名</h2>

        <div class="tabs">
    <button id="totalTab" onclick="showRanking('total')">总分</button>
    <button id="averageTab" onclick="showRanking('average')">平均分</button>
    <button id="songTab" onclick="showRanking('song')">🎵 单曲排名</button>
</div>

<div class="participant-count" id="participantCount"></div>
        <div class="last-updated" id="lastUpdated"></div>

<div id="ranking"></div>
    </div>

</div>

<script>

    const SUPABASE_URL =
        "https://jghskmotttmgyieculia.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_cBk56ezlh6xOGHXZzdnXHA_xfzmyCHB";

    let players = [];

    function addPlayer() {

    const input = document.getElementById("playerName");
    const name = input.value.trim();

    if (name === "") {
        alert("请输入参加者名字");
        return;
    }

    const exists = players.some(
    player => player.name.toLowerCase() === name.toLowerCase()
);

if (exists) {
    alert("这个参加者已经存在");
    return;
}

    players.push({
        name: name,
        scores: []
    });

    input.value = "";

    displayPlayers();
    showRanking("total");
}

    async function loadPlayers() {

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/scores?select=*",
        {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
            }
        }
    );

    const data = await response.json();

    players = [];

    data.forEach(row => {

        let player = players.find(
            p => p.name === row.player_name
        );

        if (!player) {

            player = {
                name: row.player_name,
                scores: []
            };

            players.push(player);
        }

        player.scores.push({

            id: row.id,

            song_name: row.song_name,

            score: Number(row.score)

        });

    });

    displayPlayers();

    showRanking("total");
}

    async function addScore(index) {

    const songInput = document.getElementById("song-" + index);
    const scoreInput = document.getElementById("score-" + index);

    const songName = songInput.value.trim();
    const score = parseFloat(scoreInput.value);

    if (songName === "") {
        alert("请输入歌曲名称");
        return;
    }

    if (isNaN(score)) {
        alert("请输入正确的分数");
        return;
    }
    if (score < 0 || score > 100) {
    alert("分数必须在 0 到 100 之间");
    return;
}

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/scores",
        {
            method: "POST",

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY,
                "Content-Type": "application/json",
                "Prefer": "return=minimal"
            },

            body: JSON.stringify({
                player_name: players[index].name,
                song_name: songName,
                score: score
            })
        }
    );

    if (!response.ok) {

        const error = await response.text();

        console.log(error);

        alert("分数保存失败");

        return;
    }

    songInput.value = "";
    scoreInput.value = "";

    await loadPlayers();
}

    async function deleteScore(id) {

    const confirmDelete = confirm(
        "确定要删除这首歌的分数吗？"
    );

    if (!confirmDelete) {
        return;
    }

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/scores?id=eq." + id,
        {
            method: "DELETE",

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
            }
        }
    );

    if (!response.ok) {

        const error = await response.text();

        console.log(error);

        alert("删除失败");

        return;
    }

    await loadPlayers();
}

    async function editScore(id) {

    const songName = prompt(
        "请输入新的歌曲名称："
    );

    if (songName === null) {
        return;
    }

    const newScore = prompt(
        "请输入新的分数："
    );

    if (newScore === null) {
        return;
    }

    const score = parseFloat(newScore);

    if (songName.trim() === "") {
        alert("歌曲名称不能为空");
        return;
    }

    if (isNaN(score)) {
        alert("请输入正确的分数");
        return;
    }

    if (score < 0 || score > 100) {
    alert("分数必须在 0 到 100 之间");
    return;
}

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/scores?id=eq." + id,
        {
            method: "PATCH",

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY,
                "Content-Type": "application/json",
                "Prefer": "return=minimal"
            },

            body: JSON.stringify({
                song_name: songName.trim(),
                score: score
            })
        }
    );

    if (!response.ok) {

        const error = await response.text();

        console.log(error);

        alert("修改失败");

        return;
    }

    await loadPlayers();
}


    function displayPlayers() {

    const container = document.getElementById("players");

    container.innerHTML = "";

    players.forEach((player, index) => {

        let scoresHTML = "";

        if (player.scores.length === 0) {
    scoresHTML = `
        <div class="no-score">
            🎵 还没有添加歌曲
        </div>
    `;
}

player.scores.forEach((item, scoreIndex) => {

            const scoreValue = Number(item.score);

const scoreClass =
    scoreValue >= 90 ? "score-high" :
    scoreValue >= 80 ? "score-medium" :
    "score-low";

scoresHTML += `
    <div class="score">
        第 ${scoreIndex + 1} 首：
        <strong>${item.song_name || "未命名歌曲"}</strong>
        — <strong class="${scoreClass}">${scoreValue.toFixed(2)}</strong>

<button
    class="edit-btn"
    onclick="editScore(${item.id})"
>
    ✏️
</button>

<button
    class="delete-btn"
    onclick="deleteScore(${item.id})"
>
    🗑️
</button>
                </div>
            `;

        });

        container.innerHTML += `
            <div class="player">

                <div style="width:100%">

                    <div class="player-header">
    <strong class="player-name">${player.name}</strong>

    <button
    class="delete-player-btn"
    onclick="deletePlayer(${index})"
    title="删除参加者"
>
    🗑️
</button>
</div>

                    ${scoresHTML}

                    <br>

                    <input
                        type="text"
                        id="song-${index}"
                        placeholder="输入歌曲名称"
                        onkeydown="if(event.key === 'Enter') addScore(${index})"
                    >

                    <input
    type="number"
    id="score-${index}"
    placeholder="输入分数，例如 95.50"
    step="0.01"
    min="0"
    max="100"
    onkeydown="if(event.key === 'Enter') addScore(${index})"
>

                    <button class="add-score-btn" onclick="addScore(${index})">
    ＋ 添加分数
</button>

                </div>

            </div>
        `;

    });
}


    function showRanking(type) {
    const rankingContainer = document.getElementById("ranking");

    const totalSongs = players.reduce(
    (sum, player) => sum + player.scores.length,
    0
);

document.getElementById("participantCount").innerHTML =
    `👥 参赛人数：${players.length} 人
    　🎵 总歌曲数：${totalSongs} 首`;

    document.getElementById("lastUpdated").textContent =
    "🕒 最后更新：" +
    new Date().toLocaleTimeString("zh-CN", {
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
    });

    document.getElementById("totalTab").classList.remove("active");
    document.getElementById("averageTab").classList.remove("active");
    document.getElementById("songTab").classList.remove("active");

    if (type === "total") {
    document.getElementById("totalTab").classList.add("active");
} else if (type === "average") {
    document.getElementById("averageTab").classList.add("active");
} else {
    document.getElementById("songTab").classList.add("active");
}

if (type === "song") {
    const songs = [];

    players.forEach(player => {
        player.scores.forEach(item => {
            songs.push({
                playerName: player.name,
                songName: item.song_name || "未命名歌曲",
                score: Number(item.score)
            });
        });
    });

    songs.sort((a, b) => b.score - a.score);

    rankingContainer.innerHTML = "";

    songs.forEach((song, index) => {
        const number =
            index === 0 ? "🥇" :
            index === 1 ? "🥈" :
            index === 2 ? "🥉" :
            `${index + 1}.`;

        const scoreClass =
            song.score >= 90 ? "score-high" :
            song.score >= 80 ? "score-medium" :
            "score-low";

        rankingContainer.innerHTML += `
            <div class="ranking rank-${index + 1}">
                <strong>
                    ${number} ${song.playerName}
                </strong>

                <div class="ranking-details">
                    🎵 ${song.songName}
                </div>

                <strong class="ranking-value ${scoreClass}">
                    ${song.score.toFixed(2)}
                </strong>
            </div>
        `;
    });

    return;
}
        
    let ranking = players.map(player => {

        const total = player.scores.reduce(
            (sum, item) => sum + Number(item.score),
            0
        );

        const average = player.scores.length > 0
            ? total / player.scores.length
            : 0;

        return {
    name: player.name,
    total: total,
    average: average,
    songCount: player.scores.length,
    highest: player.scores.length > 0
        ? Math.max(...player.scores.map(item => Number(item.score)))
        : 0
};

    });

    if (type === "total") {

        ranking.sort((a, b) => b.total - a.total);

    } else {

        ranking.sort((a, b) => b.average - a.average);

    }

    rankingContainer.innerHTML = "";

    ranking.forEach((player, index) => {

        const number =
            index === 0 ? "🥇" :
            index === 1 ? "🥈" :
            index === 2 ? "🥉" :
            `${index + 1}.`;

        const rankingScore =
    type === "total"
        ? player.total
        : player.average;

const rankingClass =
    rankingScore >= 90 ? "score-high" :
    rankingScore >= 80 ? "score-medium" :
    "score-low";

const value = rankingScore.toFixed(2);

        rankingContainer.innerHTML += `
            <div class="ranking rank-${index + 1}">
    <strong>
        ${number} ${player.name}
    </strong>
    <br>
    ${type === "total" ? "总分" : "平均分"}：
<strong class="ranking-value ${rankingClass}">${value}</strong>
    <div class="ranking-details">
    🎵 歌曲数：${player.songCount}
    <br>
    ⭐ 最高分：${player.highest.toFixed(2)}
</div>
</div>
        `;

    });
}

    async function deletePlayer(index) {
    const player = players[index];

    const confirmDelete = confirm(
        `确定要删除参加者「${player.name}」以及他的所有歌曲吗？`
    );

    if (!confirmDelete) {
        return;
    }

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/scores?player_name=eq." + encodeURIComponent(player.name),
        {
            method: "DELETE",
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
            }
        }
    );

    if (!response.ok) {
        const error = await response.text();
        console.log(error);
        alert("删除参加者失败");
        return;
    }

    await loadPlayers();
}

    loadPlayers();

</script>

</body>
</html>
