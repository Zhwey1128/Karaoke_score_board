<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Karaoke Score Board</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        .section {
            margin-top: 25px;
        }

        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            margin-bottom: 10px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            background: #555;
        }

        .player {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-top: 8px;
            background: #f8f8f8;
            border-radius: 8px;
        }

        .score {
            margin-top: 8px;
            padding: 8px;
            background: #fafafa;
            border-left: 3px solid #333;
        }

        .ranking {
            padding: 12px;
            margin-top: 8px;
            background: #f8f8f8;
            border-radius: 8px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tabs button {
            flex: 1;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎤 Karaoke Score Board</h1>
    <div class="subtitle">唱K大赛评分系统</div>

    <div class="section">
        <h2>👤 参加者</h2>

        <input 
            type="text" 
            id="playerName" 
            placeholder="输入参加者名字"
        >

        <button onclick="addPlayer()">＋ 添加参加者</button>

        <div id="players"></div>
    </div>

    <div class="section">
        <h2>🏆 排名</h2>

        <div class="tabs">
            <button onclick="showRanking('total')">
                总分
            </button>

            <button onclick="showRanking('average')">
                平均分
            </button>
        </div>

        <div id="ranking"></div>
    </div>

</div>

<script>

    const SUPABASE_URL =
        "https://jghskmotttmgyieculia.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_cBk56ezlh6xOGHXZzdnXHA_xfzmyCHB";

    let players = [];

    function addPlayer() {

    const input = document.getElementById("playerName");
    const name = input.value.trim();

    if (name === "") {
        alert("请输入参加者名字");
        return;
    }

    players.push({
        name: name,
        scores: []
    });

    input.value = "";

    displayPlayers();
    showRanking("total");
}

    async function loadPlayers() {

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/scores?select=*",
        {
            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
            }
        }
    );

    const data = await response.json();

    players = [];

    data.forEach(row => {

        let player = players.find(
            p => p.name === row.player_name
        );

        if (!player) {

            player = {
                name: row.player_name,
                scores: []
            };

            players.push(player);
        }

        player.scores.push({

            id: row.id,

            song_name: row.song_name,

            score: Number(row.score)

        });

    });

    displayPlayers();

    showRanking("total");
}

    async function addScore(index) {

    const songInput = document.getElementById("song-" + index);
    const scoreInput = document.getElementById("score-" + index);

    const songName = songInput.value.trim();
    const score = parseFloat(scoreInput.value);

    if (songName === "") {
        alert("请输入歌曲名称");
        return;
    }

    if (isNaN(score)) {
        alert("请输入正确的分数");
        return;
    }

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/scores",
        {
            method: "POST",

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY,
                "Content-Type": "application/json",
                "Prefer": "return=minimal"
            },

            body: JSON.stringify({
                player_name: players[index].name,
                song_name: songName,
                score: score
            })
        }
    );

    if (!response.ok) {

        const error = await response.text();

        console.log(error);

        alert("分数保存失败");

        return;
    }

    songInput.value = "";
    scoreInput.value = "";

    await loadPlayers();
}

    async function deleteScore(id) {

    const confirmDelete = confirm(
        "确定要删除这首歌的分数吗？"
    );

    if (!confirmDelete) {
        return;
    }

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/scores?id=eq." + id,
        {
            method: "DELETE",

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY
            }
        }
    );

    if (!response.ok) {

        const error = await response.text();

        console.log(error);

        alert("删除失败");

        return;
    }

    await loadPlayers();
}

    async function editScore(id) {

    const songName = prompt(
        "请输入新的歌曲名称："
    );

    if (songName === null) {
        return;
    }

    const newScore = prompt(
        "请输入新的分数："
    );

    if (newScore === null) {
        return;
    }

    const score = parseFloat(newScore);

    if (songName.trim() === "") {
        alert("歌曲名称不能为空");
        return;
    }

    if (isNaN(score)) {
        alert("请输入正确的分数");
        return;
    }

    const response = await fetch(
        SUPABASE_URL + "/rest/v1/scores?id=eq." + id,
        {
            method: "PATCH",

            headers: {
                "apikey": SUPABASE_KEY,
                "Authorization": "Bearer " + SUPABASE_KEY,
                "Content-Type": "application/json",
                "Prefer": "return=minimal"
            },

            body: JSON.stringify({
                song_name: songName.trim(),
                score: score
            })
        }
    );

    if (!response.ok) {

        const error = await response.text();

        console.log(error);

        alert("修改失败");

        return;
    }

    await loadPlayers();
}


    function displayPlayers() {

    const container = document.getElementById("players");

    container.innerHTML = "";

    players.forEach((player, index) => {

        let scoresHTML = "";

        player.scores.forEach((item, scoreIndex) => {

            scoresHTML += `
                <div class="score">
                    第 ${scoreIndex + 1} 首：
                    ${item.song_name || "未命名歌曲"}
                    — ${Number(item.score).toFixed(2)}

                    <button
    onclick="editScore(${item.id})"
    style="margin-left:8px;"
>
    ✏️
</button>

<button
    onclick="deleteScore(${item.id})"
    style="margin-left:8px;"
>
    🗑️
</button>
                </div>
            `;

        });

        container.innerHTML += `
            <div class="player">

                <div style="width:100%">

                    <strong>${player.name}</strong>

                    ${scoresHTML}

                    <br>

                    <input
                        type="text"
                        id="song-${index}"
                        placeholder="输入歌曲名称"
                    >

                    <input
                        type="number"
                        id="score-${index}"
                        placeholder="输入分数，例如 95.50"
                        step="0.01"
                    >

                    <button onclick="addScore(${index})">
                        ＋ 添加分数
                    </button>

                </div>

            </div>
        `;

    });
}


    function showRanking(type) {

    const rankingContainer = document.getElementById("ranking");

    let ranking = players.map(player => {

        const total = player.scores.reduce(
            (sum, item) => sum + Number(item.score),
            0
        );

        const average = player.scores.length > 0
            ? total / player.scores.length
            : 0;

        return {
            name: player.name,
            total: total,
            average: average
        };

    });

    if (type === "total") {

        ranking.sort((a, b) => b.total - a.total);

    } else {

        ranking.sort((a, b) => b.average - a.average);

    }

    rankingContainer.innerHTML = "";

    ranking.forEach((player, index) => {

        const number =
            index === 0 ? "🥇" :
            index === 1 ? "🥈" :
            index === 2 ? "🥉" :
            `${index + 1}.`;

        const value =
            type === "total"
                ? player.total.toFixed(2)
                : player.average.toFixed(2);

        rankingContainer.innerHTML += `
            <div class="ranking">
                <strong>
                    ${number} ${player.name}
                </strong>
                <br>
                ${type === "total" ? "总分" : "平均分"}：${value}
            </div>
        `;

    });
}

    loadPlayers();

</script>

</body>
</html>
